name: Composition material

on:
  pull_request:
    paths:
      - 'src/nnue/**'
      - 'tests/composition.*'
      - '.github/workflows/composition.yml'
  push:
    branches: [experiment/composition-material]

jobs:
  accumulator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [scalar, avx2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: tests/composition.sh ${{ matrix.architecture }}
